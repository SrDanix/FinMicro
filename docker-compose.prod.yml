# Producción en la instancia EC2 (detrás de Nginx con HTTPS).
# Uso:  docker compose -f docker-compose.prod.yml up -d --build
#
# Las variables se leen del archivo .env del servidor (ver .env.example).
# - Con AWS RDS: define DB_ENGINE=postgresql, DB_HOST=<endpoint de RDS>,
#   DB_SSLMODE=require y el resto de DB_* (docs/17_base_de_datos_aws.md).
# - Sin DB_ENGINE: usa SQLite en el volumen (etapa E0 del plan de escalamiento).
services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # solo accesible desde Nginx, no desde internet
    env_file: .env
    environment:
      DJANGO_DEBUG: "False"
      SQLITE_PATH: "/app/data/db.sqlite3"
    volumes:
      - finmicro_datos:/app/data

volumes:
  finmicro_datos:
