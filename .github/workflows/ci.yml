# Integración continua (actividad 6.1 de la carta Gantt).
# Corre en cada push y en cada pull request hacia main. Un PR no se
# integra si este flujo falla (ver docs/10_definition_of_done.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    name: Pruebas (${{ matrix.base_de_datos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SQLite: desarrollo y etapa E0. PostgreSQL: AWS RDS (doc 17).
        base_de_datos: [sqlite, postgresql]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finmicro
          POSTGRES_USER: finmicro
          POSTGRES_PASSWORD: finmicro-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finmicro"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_ENGINE: ${{ matrix.base_de_datos == 'postgresql' && 'postgresql' || '' }}
      DB_NAME: finmicro
      DB_USER: finmicro
      DB_PASSWORD: finmicro-ci
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run

      - name: Pruebas automatizadas
        run: python manage.py test --verbosity 2

  despliegue:
    name: Checklist de despliegue de Django
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: check --deploy
        env:
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-${{ github.sha }}-clave-larga-solo-para-verificar-la-configuracion
          DJANGO_ALLOWED_HOSTS: finmicro.example.com
        run: python manage.py check --deploy --fail-level WARNING

  docker:
    name: Construcción de la imagen Docker
    runs-on: ubuntu-latest
    needs: [pruebas, despliegue]
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t finmicro:${{ github.sha }} .
